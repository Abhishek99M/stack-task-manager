services:
  postgres:
    image: postgres:16-alpine
    container_name: stack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stack
      POSTGRES_PASSWORD: stack
      POSTGRES_DB: stack
    ports:
      - "5432:5432"
    volumes:
      - stack-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack -d stack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stack-pg-data:
